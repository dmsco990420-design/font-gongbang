<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>글꼴 정원</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f8a57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="글꼴 정원">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--bg:#f7f3ea;--card:#fff;--ink:#1d1d1b;--mute:#7a746a;--line:#e6dfd2;--acc:#2f8a57;--acc2:#e7f3ea;--pink:#e36b8f;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 13px;min-height:42px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.on{background:var(--ink);border-color:var(--ink);color:#fff}
button:disabled{opacity:.45}
input[type=text],textarea,select{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%;color:var(--ink)}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 6px;max-width:1100px;margin:0 auto}
header h1{margin:0;font-size:24px;letter-spacing:-.5px}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:6px 14px 24px}
.view{display:none}.view.show{display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border-radius:999px;min-height:38px;padding:7px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-top:8px}
.card{background:var(--card);border-radius:var(--r);padding:14px 14px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(60,40,0,.05);position:relative}
.card h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:6px}
.card h3 small{color:var(--mute);font-weight:400;font-size:12px}
.card .pv{overflow:hidden;cursor:pointer}
.card .pv svg{display:block;max-width:100%;height:auto}
.card .acts{display:flex;gap:6px;margin-top:10px}
.card .acts button{flex:1 1 auto;padding:8px 6px;font-size:13.5px;min-height:40px;white-space:nowrap}.card .acts button[data-act=ed],.card .acts button[data-act=del]{flex:0 0 44px}
.heart.on{background:#fde8ef;border-color:var(--pink);color:#c2335d}
.pick.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.big{font-size:17px;min-height:50px;padding:12px 18px;border-radius:14px}
.sec{background:var(--card);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sec h2{font-size:16px;margin:0 0 10px}
.sl{display:grid;grid-template-columns:7.2em 1fr 3.4em;align-items:center;gap:8px;margin:6px 0}
.sl label{font-size:14px}.sl output{font-size:13px;color:var(--mute);text-align:right}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;border-radius:0;min-height:42px;padding:8px 4px;font-size:14px}
.seg button+button{border-left:1.5px solid var(--line)}
.mute{color:var(--mute);font-size:13px}
.gl{display:flex;flex-wrap:wrap;gap:4px}
.gl div{width:50px;height:54px;background:#fbfaf7;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50}
.tabbar button{flex:1;border:0;background:none;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;color:var(--mute)}
.tabbar button b{font-size:21px;font-weight:400}
.tabbar button.on{color:var(--acc);font-weight:700}
.float{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:94vw}
.float button{background:#fff;color:var(--ink);border:0}
.hide{display:none!important}
.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.stage{border-radius:16px;padding:22px 20px;overflow:hidden}
.stage svg{display:block;max-width:100%;height:auto}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 4px}
@media (min-width:800px){.edwrap{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:start}}
</style>
</head>
<body>
<header><h1>🌱 글꼴 정원</h1><p>획의 뼈대에 펜을 입혀 두께가 고른 한글 폰트를 키워요. 마음에 드는 걸 보관하고, 비슷하게 더 뽑고, 서로 섞어 보세요.</p></header>
<main>
<!-- 뽑기 -->
<section class="view show" id="v-gen">
 <div class="chips" id="moods"></div>
 <div class="row"><button class="pri big" id="btnGen" style="flex:1">🎲 새 글씨 12개 뽑기</button><button class="big" id="btnBack" title="이전 뽑기">↶</button></div>
 <div class="row" style="margin-top:10px"><input type="text" id="sampleA" aria-label="제목 문장" value="여백 꾸불 무료 폰트"><input type="text" id="sampleB" aria-label="보기 문장" value="아니요, 아직 못 먹었습니다."></div>
 <p class="mute" id="genInfo" style="margin:8px 2px 0"></p>
 <div class="grid" id="genGrid"></div>
</section>
<!-- 다듬기 -->
<section class="view" id="v-ed">
 <div id="edEmpty" class="empty">뽑기에서 마음에 드는 글씨의 ✏️ 다듬기를 눌러 주세요.</div>
 <div id="edBox" class="hide">
  <div class="sticky"><div class="card" style="padding:10px 12px"><div class="row" style="flex-wrap:nowrap"><input type="text" id="edName" aria-label="폰트 이름" style="font-weight:700;padding:7px 10px"><button id="edUndo" title="되돌리기">↶</button><button id="edRedo" title="다시">↷</button></div>
    <div id="edPv" style="margin-top:8px"></div></div></div>
  <div class="edwrap"><div>
   <div class="sec"><h2>자주 쓰는 글자 점검</h2><div class="gl" id="edGl"></div><input type="text" id="edGlTxt" style="margin-top:8px" value="가각간갈감갑강같갛 괘괜쾅뷁똠쌍 몇읽앉흙 ㅋㅋㅠㅠ Aag1!?♡"></div>
  </div>
  <div>
   <div class="sec"><h2>펜</h2><div class="seg" id="edPen"><button data-pen="round">둥근펜</button><button data-pen="square">네모펜</button><button data-pen="brush">붓펜</button><button data-pen="pixel">픽셀</button></div><div id="edSl1"></div></div>
   <div class="sec"><h2>뼈대 모양 <small class="mute" style="font-weight:400">눌러서 바꿔요</small></h2><div id="edGenes"></div></div>
   <div class="sec"><h2>짜임새</h2><div id="edSl5"></div></div>
   <div class="sec"><h2>손맛</h2><div id="edSl2"></div><button id="edSeed" style="margin-top:6px">🎲 손떨림 무늬 바꾸기</button></div>
   <div class="sec"><h2>모양과 자리</h2><div id="edSl3"></div></div>
   <div class="sec"><h2>영문·숫자</h2><div id="edSl4"></div></div>
   <div class="sec"><h2>저장</h2>
    <div class="row"><button class="pri" id="edKeep" style="flex:1">♡ 보관함에 넣기</button><button id="edLike" style="flex:1">🌱 비슷하게 12개</button></div>
    <div class="row" style="margin-top:8px"><button class="pri" id="edTTF" style="flex:1;background:#1d1d1b;border-color:#1d1d1b">⬇︎ TTF 폰트 파일로 저장</button></div>
    <div class="bar hide" id="edBar"><i></i></div><p class="mute" id="edMsg">한글 11,172자 + 낱자모 + 영문·숫자·기호가 모두 들어가요.</p></div>
  </div></div>
 </div>
</section>
<!-- 보관함 -->
<section class="view" id="v-keep">
 <div class="row"><h2 style="margin:6px 0;font-size:18px;flex:1">🧺 보관함</h2></div>
 <p class="mute" style="margin:0 2px 6px">보관한 글씨는 이 기기에 저장돼요. 두 개 이상 🧬 골라서 섞으면 새 글씨가 나와요.</p>
 <div class="grid" id="keepGrid"></div>
</section>
<!-- 미리보기 -->
<section class="view" id="v-pv">
 <div class="sec" style="margin-top:4px">
  <div class="row"><select id="pvFont" style="flex:1"></select></div>
  <textarea id="pvTxt" rows="5" style="margin-top:8px">부정하여 대답하는 말은 감탄사로서 아래와 같이 '아니요'로 적습니다. 긍정하여 대답하는 말 '응'에 대응하여, 부정하여 대답하는 말 '아니'를 쓰는 것처럼 '예/네'에 대응하여 감탄사 '아니'에 두루 높임의 보조사 '요'를 붙인 '아니요'를 쓰는 것입니다.</textarea>
  <div class="row" style="margin-top:8px"><input type="text" id="pvTitle" value="여백 꾸불 무료 폰트" aria-label="제목"></div>
  <div class="sl"><label>글자 크기</label><input type="range" id="pvSize" min="16" max="60" value="26"><output id="pvSizeO">26</output></div>
  <div class="seg" id="pvBg"><button data-bg="paper" class="on">종이</button><button data-bg="sky">하늘</button><button data-bg="pink">분홍</button><button data-bg="night">밤</button></div>
 </div>
 <div class="stage" id="pvStage" style="margin-top:12px"></div>
 <div class="row" style="margin-top:10px"><button class="pri" id="pvPng" style="flex:1">🖼 이미지로 저장</button></div>
 <p class="mute" id="pvMsg"></p>
</section>
</main>
<div class="float hide" id="mixBar"><span id="mixTxt"></span><button id="mixGo">🧬 섞어서 12개</button><button id="mixClr">✕</button></div>
<nav class="tabbar"><button data-v="gen" class="on"><b>🎲</b>뽑기</button><button data-v="ed"><b>✏️</b>다듬기</button><button data-v="keep"><b>🧺</b>보관함</button><button data-v="pv"><b>👀</b>미리보기</button></nav>
<div class="toast" id="toast"></div>
<script>
// ===== 글꼴 정원 엔진: 뼈대(획 중심선) + 펜 → 두께가 고른 글자 =====
const GE=(()=>{
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',
 JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],
 DBL={'ㄲ':'ㄱㄱ','ㄸ':'ㄷㄷ','ㅃ':'ㅂㅂ','ㅆ':'ㅅㅅ','ㅉ':'ㅈㅈ','ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'},
 VV='ㅏㅐㅑㅒㅓㅔㅕㅖㅣ',HV='ㅗㅛㅜㅠㅡ',MV={'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};

// ---- 자음 뼈대 (상자 안 0~1, y 아래로) : kind v(세로모음 옆) h(가로모음 위) j(받침) ----
// ---- 자음 뼈대 변형(유전자) : 상자 안 0~1, y 아래로. kind v(세로모음 옆) h(가로모음 위) j(받침) ----
const sub=(p,b)=>({p,b});
const TICK={v:'M.5 0 L.5 1',h:'M.2 .55 L.8 .55',dot:'D.5 .6',slant:'M.32 0 L.68 1'};
const OSH={free:'O.5 .5 .44 .44',rsq:'M.32 .06 L.68 .06 Q.94 .06 .94 .32 L.94 .68 Q.94 .94 .68 .94 L.32 .94 Q.06 .94 .06 .68 L.06 .32 Q.06 .06 .32 .06 Z',small:'O.5 .58 .34 .34',egg:'M.5 .06 Q.88 .06 .92 .56 Q.94 .94 .5 .94 Q.06 .94 .08 .56 Q.12 .06 .5 .06 Z'};
const SSH={fork:k=>k==='v'?'M.54 .04 Q.5 .6 .02 .96 M.52 .48 Q.7 .8 .98 .94':'M.5 .04 Q.42 .62 .02 .95 M.5 .4 Q.62 .76 .98 .95',
 tent:k=>'M.5 .04 Q.4 .58 .02 .96 M.5 .04 Q.6 .58 .98 .96',
 hand:k=>k==='v'?'M.58 .04 Q.46 .72 .04 .96 M.44 .56 L.96 .9':'M.55 .04 Q.44 .7 .03 .95 M.46 .5 L.97 .92',
 angle:k=>'M.5 .04 L.04 .95 M.5 .04 L.96 .95'};
const KSH={sq:k=>k==='v'?'M.04 .1 L.9 .1 L.9 .96':'M.04 .12 L.94 .12 L.94 .96',
 sweep:k=>k==='v'?'M.04 .1 L.84 .1 Q.95 .1 .93 .26 Q.86 .7 .3 .98':'M.04 .12 L.86 .12 Q.95 .12 .95 .3 L.95 .96',
 diag:k=>k==='v'?'M.04 .1 L.92 .1 L.4 .98':'M.04 .12 L.94 .12 L.8 .96',
 hook:k=>k==='v'?'M.06 .17 Q.5 .05 .92 .1 Q.92 .62 .5 .98':'M.04 .17 Q.5 .07 .94 .12 Q.97 .6 .9 .96'};
const DSH={sq:'M.94 .1 L.08 .1 L.08 .9 L.96 .9',round:'M.94 .1 L.08 .1 L.08 .56 Q.08 .9 .42 .9 L.96 .9',hand:'M.9 .07 L.1 .12 L.08 .9 L.96 .85'};
const G0={k:'sq',n:'flat',d:'sq',r:'sq',m:'sq',b:'std',s:'fork',j:'top',o:'free',t:'v',p:'std',v:'line'};
const GENES={k:['sq','sweep','diag','hook'],n:['flat','up','round'],d:['sq','round','hand'],r:['sq','round','hand'],m:['sq','round','trap'],b:['std','round','splay'],s:['fork','tent','hand','angle'],j:['top','z'],o:['free','rsq','small','egg'],t:['v','h','dot','slant'],p:['std','slant','hand'],v:['line','short','dot']};
const CON={
 'ㄱ':(k,G)=>KSH[G.k](k),
 'ㅋ':(k,G)=>KSH[G.k](k)+(k==='v'?(G.k==='sq'?' M.04 .52 L.86 .52':' M.06 .5 L.72 .5'):(G.k==='diag'?' M.04 .54 L.84 .54':' M.04 .54 L.9 .54')),
 'ㄴ':(k,G)=>({flat:'M.1 .02 L.1 .88 L.98 .88',up:'M.1 .02 L.1 .8 Q.11 .9 .3 .9 L.98 .8',round:'M.1 .02 L.1 .56 Q.1 .9 .46 .9 L.98 .9'})[G.n],
 'ㄷ':(k,G)=>DSH[G.d],
 'ㅌ':(k,G)=>DSH[G.d]+' M.08 .49 L.88 .49',
 'ㄹ':(k,G)=>({sq:'M.06 .07 L.9 .07 L.9 .48 L.1 .48 L.1 .92 L.96 .92',round:'M.06 .07 L.66 .07 Q.92 .07 .92 .28 Q.92 .48 .66 .48 L.34 .48 Q.1 .48 .1 .7 Q.1 .92 .34 .92 L.96 .92',hand:'M.06 .09 L.9 .06 L.86 .46 L.12 .5 L.1 .92 L.96 .88'})[G.r],
 'ㅁ':(k,G)=>({sq:'M.08 .08 L.92 .08 L.92 .92 L.08 .92 Z',round:'M.32 .08 L.68 .08 Q.92 .08 .92 .32 L.92 .68 Q.92 .92 .68 .92 L.32 .92 Q.08 .92 .08 .68 L.08 .32 Q.08 .08 .32 .08 Z',trap:'M.04 .08 L.96 .08 L.86 .92 L.14 .92 Z'})[G.m],
 'ㅂ':(k,G)=>({std:'M.1 .02 L.1 .92 L.9 .92 L.9 .02 M.1 .47 L.9 .47',round:'M.1 .02 L.1 .66 Q.1 .92 .36 .92 L.64 .92 Q.9 .92 .9 .66 L.9 .02 M.1 .45 L.9 .45',splay:'M.03 .02 L.13 .92 L.87 .92 L.97 .02 M.08 .47 L.92 .47'})[G.b],
 'ㅅ':(k,G)=>SSH[G.s](k),
 'ㅈ':(k,G)=>G.j==='z'?'M.06 .1 L.88 .1 L.08 .95 M.5 .52 L.96 .93':[sub(k==='v'?'M.06 .1 L.9 .1':'M.04 .1 L.96 .1',[0,0,1,1]),sub(SSH[G.s](k),[0,.14,1,1])],
 'ㅊ':(k,G)=>[sub(TICK[G.t],[.4,0,.6,.12]),sub(CON['ㅈ'](k,G),[0,.2,1,1])],
 'ㅇ':(k,G)=>OSH[G.o],
 'ㅎ':(k,G)=>[sub(TICK[G.t],[.4,0,.6,.11]),sub('M.1 .5 L.9 .5',[0,0,1,.46]),sub(OSH[G.o],[.15,.34,.85,1])],
 'ㅍ':(k,G)=>({std:'M.04 .08 L.96 .08 M.3 .1 L.3 .9 M.7 .1 L.7 .9 M.02 .9 L.98 .9',slant:'M.04 .08 L.96 .08 M.28 .1 L.36 .9 M.72 .1 L.64 .9 M.02 .9 L.98 .9',hand:'M.04 .08 L.96 .1 M.3 .12 L.4 .88 M.72 .12 L.62 .88 M.02 .9 L.98 .87'})[G.p],
};
// ---- 모음 뼈대 (줄기 길이·곁줄기 길이/높이·꼭지 길이 조절) ----
const VSET='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅛㅜㅠㅡㅣ';
function vowPath(V,P){const gv=P.G.v,bl=P.bl*(gv==='short'?.62:1),bp=P.bp,t=P.vs*.18,bt=1-P.vs*.07,f=v=>Math.round(v*1000)/1000;
 const st=(x,a=t,b=bt)=>`M${f(x)} ${f(a)} L${f(x)} ${f(b)} `,u=P.stub;
 const br=(x0,x1,y)=>{if(gv!=='dot')return`M${f(x0)} ${f(y)} L${f(x1)} ${f(y)} `;const sx=Math.abs(x0-.3)<.02||Math.abs(x0-.22)<.02?x0:x1;const ex=sx===x0?x1:x0;return`E${f(sx+(ex-sx)*.82)} ${f(y)} `};
 switch(V){case 'ㅏ':return st(.3)+br(.3,.3+.56*bl,bp);case 'ㅑ':return st(.3)+br(.3,.3+.56*bl,bp-.13)+br(.3,.3+.56*bl,bp+.14);

function hs(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function parse(path){const tk=path.match(/[MLQOZADE]|-?[\d.]+/g)||[];let i=0;const num=()=>+tk[i++];const subs=[];let cur=null,pos=[0,0];

  if(c==='M'){pos=[num(),num()];cur={segs:[],start:pos,closed:false};subs.push(cur)}
  else if(c==='L'){const p=[num(),num()];cur.segs.push({t:'L',a:pos,b:p});pos=p}
  else if(c==='Q'){const q=[num(),num()],p=[num(),num()];cur.segs.push({t:'Q',a:pos,c:q,b:p});pos=p}
  else if(c==='Z'){cur.closed=true;if(pos[0]!==cur.start[0]||pos[1]!==cur.start[1]){cur.segs.push({t:'L',a:pos,b:cur.start});pos=cur.start}}
  else if(c==='O'){subs.push({ell:[num(),num(),num(),num()]});cur=null}
  else if(c==='D'){subs.push({dot:[num(),num()]});cur=null}
  else if(c==='E'){subs.push({dot:[num(),num()],big:1});cur=null}
  else if(c==='A'){const cx=num(),cy=num(),rx=num(),ry=num(),a0=num(),a1=num();const pts=[];const n=Math.max(6,Math.ceil(Math.abs(a1-a0)/12));for(let k=0;k<=n;k++){const a=(a0+(a1-a0)*k/n)*Math.PI/180;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}
   if(cur&&cur.segs.length===0&&cur.start){}
   if(!cur){cur={segs:[],start:pts[0],closed:false};subs.push(cur);pos=pts[0]}else{cur.segs.push({t:'L',a:pos,b:pts[0]});pos=pts[0]}
   for(let k=1;k<pts.length;k++){cur.segs.push({t:'C',a:pos,b:pts[k]});pos=pts[k]}}

$('mixGo').onclick=()=>{const fs=ST.pick.map(findF).filter(Boolean);if(fs.length<2)return;const out=[];for(let i=0;i<12;i++){const a=fs[i%fs.length];let b=pk(fs);while(b===a)b=pk(fs);out.push(breed(a,b))}ST.pick=[];newGen(out,`🧬 ${fs.map(f=>f.name).join(' × ')} 섞은 글씨 12개`);go('gen');renderMix()};
$('mixClr').onclick=()=>{ST.pick=[];save();renderAll()};
function renderKeep(){const g=$('keepGrid');if(!ST.keep.length){g.innerHTML='<div class="empty">아직 보관한 글씨가 없어요. 뽑기에서 ♡를 눌러 보세요.</div>';return}g.innerHTML=ST.keep.map(f=>cardHTML(f,'keep')).join('');bindGrid(g,'keep')}

// ---- 다듬기 ----
const SL={edSl1:[['w','굵기',30,125,1,v=>v],['contrast','가로획 가늘게',0,.8,.01,v=>Math.round(v*100)+'%'],['grid','픽셀 칸 수',10,24,1,v=>v+'칸'],['pxT','픽셀 굵기',1,2,1,v=>v+'칸']],
 edSl2:[['corner','모서리 둥글게',0,1,.01,v=>Math.round(v*100)+'%'],['curve','획 휘어짐',0,1,.01,v=>Math.round(v*100)+'%'],['wobble','손떨림',0,1,.01,v=>Math.round(v*100)+'%'],['bounce','통통 튀기',0,1,.01,v=>Math.round(v*100)+'%'],['slant','기울기',-.05,.2,.005,v=>Math.round(v*100)+'%']],
 edSl3:[['adv','글자 폭',800,1100,5,v=>v],['size','글자 크기',.8,1,.005,v=>Math.round(v*100)+'%'],['gap','자모 사이',.8,1.4,.01,v=>Math.round(v*100)+'%'],['frame','탈네모',0,1,.01,v=>Math.round(v*100)+'%'],['jr','받침 높이',.5,.7,.005,v=>Math.round(v*100)],['oRound','ㅇ 동그랗게',0,1,.01,v=>Math.round(v*100)+'%'],['track','자간',-60,120,2,v=>v]],
 edSl4:[['lat','영문 크기',.8,1.1,.01,v=>Math.round(v*100)+'%'],['latW','영문 폭',.8,1.2,.01,v=>Math.round(v*100)+'%']],
 edSl5:[['rise','가로획 오르기',-.02,.14,.005,v=>Math.round(v*100)+'%'],['sag','가로획 휘기',-.6,.8,.02,v=>(v>0?'웃음 ':v<0?'아치 ':'')+Math.round(Math.abs(v)*100)],['vs','모음 줄기 짧게',0,1,.01,v=>Math.round(v*100)+'%'],['bl','곁줄기 길이',.55,1.2,.01,v=>Math.round(v*100)+'%'],['bp','곁줄기 높이',.36,.56,.005,v=>Math.round(v*100)],['stub','ㅗㅜ 꼭지 길이',.45,1,.01,v=>Math.round(v*100)+'%'],['vwF','모음 칸 폭',.8,1.35,.01,v=>Math.round(v*100)+'%'],['vh','글자 높이',.8,1.05,.005,v=>Math.round(v*100)+'%'],['fa','짧은 글자 정렬',0,1,.01,v=>v<.33?'위':v>.66?'아래':'가운데'],['prop','글자마다 폭 다르게',0,1,.01,v=>Math.round(v*100)+'%'],['blob','획 끝 방울',0,1,.01,v=>Math.round(v*100)+'%']]};
Object.entries(SL).forEach(([box,list])=>{$(box).innerHTML=list.map(([k,lab,a,b,st])=>`<div class="sl" data-k="${k}"><label for="s_${k}">${lab}</label><input type="range" id="s_${k}" min="${a}" max="${b}" step="${st}"><output id="o_${k}"></output></div>`).join('')});
const ALLSL=Object.values(SL).flat();let edUndo=[],edRedo=[],slT=0,dragging=false;
function curP(){return GE.norm(ST.cur.p)}
function syncEd(){const f=ST.cur,P=GE.norm(f.p);$('edName').value=f.name;document.querySelectorAll('[data-pen]').forEach(b=>b.classList.toggle('on',b.dataset.pen===(f.p.pen||'round')));
 ALLSL.forEach(([k,,,,,fmt])=>{const v=f.p[k]??P[k]??(k==='grid'?16:0);$('s_'+k).value=v;$('o_'+k).textContent=fmt(+v)});
 const px=f.p.pen==='pixel';['grid','pxT'].forEach(k=>document.querySelector(`.sl[data-k="${k}"]`).classList.toggle('hide',!px));['w','contrast'].forEach(k=>document.querySelector(`.sl[data-k="${k}"]`).classList.toggle('hide',px));
 $('edUndo').disabled=!edUndo.length;$('edRedo').disabled=!edRedo.length;$('edKeep').textContent=isKept(f.id)?'♥ 보관함에 저장됨 (바뀐 것도 저장돼요)':'♡ 보관함에 넣기'}
const GL={k:['ㄱ 꺾임','가',{sq:'직각',sweep:'곡선',diag:'사선',hook:'갈고리'}],n:['ㄴ 끝','나',{flat:'평평',up:'올림',round:'둥글게'}],d:['ㄷ·ㅌ','다',{sq:'네모',round:'둥근',hand:'손글씨'}],r:['ㄹ','라',{sq:'네모',round:'둥근',hand:'손글씨'}],m:['ㅁ','마',{sq:'네모',round:'둥근',trap:'사다리'}],b:['ㅂ','바',{std:'기본',round:'둥근',splay:'벌림'}],s:['ㅅ·ㅈ·ㅊ','사',{fork:'갈래',tent:'지붕',hand:'손글씨',angle:'꺾쇠'}],j:['ㅈ','자',{top:'뚜껑',z:'Z자'}],o:['ㅇ·ㅎ','오',{free:'동그라미',rsq:'둥근네모',small:'작은 원',egg:'달걀'}],t:['꼭지(ㅎ·ㅊ)','하',{v:'세로',h:'가로',dot:'점',slant:'비스듬'}],p:['ㅍ','파',{std:'기본',slant:'모음',hand:'손글씨'}],v:['모음 곁줄기','나',{line:'선',short:'짧게',dot:'동그란 점'}]};
function drawGenes(){const f=ST.cur;if(!f)return;const g={...GE.G0,...(f.p.g||{})};$('edGenes').innerHTML=Object.entries(GL).map(([k,[lab,ch,names]])=>`<div class="row" style="gap:5px;margin:6px 0;flex-wrap:nowrap"><span style="font-size:13px;flex:0 0 4.6em;line-height:1.2">${lab}</span><div class="row" style="gap:5px">${GA[k].map(v=>{const p2={...f.p,g:{...g,[k]:v}};return`<button data-gk="${k}" data-gv="${v}" class="${g[k]===v?'on':''}" style="padding:3px 5px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:52px;min-height:0;${g[k]===v?'background:var(--acc2);border-color:var(--acc);color:var(--acc)':''}">${svgText({p:p2},ch,{size:28,color:'#1d1d1b'})}<span style="font-size:11px">${names[v]}</span></button>`}).join('')}</div></div>`).join('');
 $('edGenes').querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{setP('g',{...g,[b.dataset.gk]:b.dataset.gv});drawGenes();renderGen();renderKeep()})}
function drawEd(){const f=ST.cur;if(!f)return;const W=Math.min(620,$('edPv').clientWidth||340);$('edPv').innerHTML=svgText(f,ST.sampleA,{size:Math.max(28,Math.min(46,W/10)),maxPx:W})+'<div style="height:4px"></div>'+svgText(f,ST.sampleB,{size:18,maxPx:W,color:'#333'});
 const pkey=JSON.stringify(f.p);$('edGl').innerHTML=[...$('edGlTxt').value].filter(c=>c.trim()).slice(0,60).map(c=>`<div>${svgText(f,c,{size:36})}</div>`).join('')}
function setP(k,v,live){const f=ST.cur;if(!dragging){edUndo.push(JSON.stringify(f.p));edRedo=[];if(edUndo.length>80)edUndo.shift()}f.p={...f.p,[k]:v};keepSync();if(live){cancelAnimationFrame(slT);slT=requestAnimationFrame(drawEd)}else drawEd();syncEd();save()}
function keepSync(){const f=ST.cur,i=ST.keep.findIndex(x=>x.id===f.id);if(i>=0)ST.keep[i]=JSON.parse(JSON.stringify(f));const j=ST.gen.findIndex(x=>x.id===f.id);if(j>=0)ST.gen[j]=JSON.parse(JSON.stringify(f))}
ALLSL.forEach(([k,,,,,fmt])=>{const el=$('s_'+k);el.addEventListener('pointerdown',()=>{edUndo.push(JSON.stringify(ST.cur.p));edRedo=[];dragging=true});
 el.addEventListener('input',()=>{const v=INT[k]?Math.round(+el.value):+el.value;$('o_'+k).textContent=fmt(v);setP(k,v,true)});
 el.addEventListener('change',()=>{dragging=false;renderGen();renderKeep();drawGenes()})});
document.addEventListener('pointerup',()=>{dragging=false});
document.querySelectorAll('[data-pen]').forEach(b=>b.onclick=()=>{setP('pen',b.dataset.pen);if(b.dataset.pen==='pixel'&&!ST.cur.p.grid){ST.cur.p.grid=16;ST.cur.p.pxT=1}syncEd();drawEd();renderGen();renderKeep()});
$('edSeed').onclick=()=>{setP('seed',Math.floor(R()*1e9));renderGen();renderKeep()};
$('edName').addEventListener('input',()=>{ST.cur.name=$('edName').value||'이름 없는 글씨';keepSync();save()});
$('edName').addEventListener('change',()=>{renderGen();renderKeep();fillPvFonts()});
$('edUndo').onclick=()=>{if(!edUndo.length)return;edRedo.push(JSON.stringify(ST.cur.p));ST.cur.p=JSON.parse(edUndo.pop());keepSync();save();syncEd();drawEd();drawGenes();renderGen();renderKeep()};
$('edRedo').onclick=()=>{if(!edRedo.length)return;edUndo.push(JSON.stringify(ST.cur.p));ST.cur.p=JSON.parse(edRedo.pop());keepSync();save();syncEd();drawEd();drawGenes();renderGen();renderKeep()};
$('edGlTxt').addEventListener('input',()=>{clearTimeout(slT);slT=setTimeout(drawEd,200)});
$('edKeep').onclick=()=>{if(!isKept(ST.cur.id)){ST.keep.unshift(JSON.parse(JSON.stringify(ST.cur)));toast('보관함에 넣었어요')}else toast('보관함에 저장돼 있어요');save();syncEd();renderGen();renderKeep();fillPvFonts()};
$('edLike').onclick=()=>{const f=ST.cur;newGen(Array.from({length:12},()=>mutate(f,.09)),`‘${f.name}’과 비슷한 글씨 12개`);go('gen')};
function openEd(f){if(!ST.cur||ST.cur.id!==f.id){edUndo=[];edRedo=[]}ST.cur=JSON.parse(JSON.stringify(f));save();go('ed')}
function renderEd(){const has=!!ST.cur;$('edEmpty').classList.toggle('hide',has);$('edBox').classList.toggle('hide',!has);if(has){syncEd();drawEd();drawGenes()}}

// ---- TTF ----
let DL=null;(async()=>{try{if(window.claude&&claude.use)DL=await claude.use('downloads')}catch(e){DL=null}})();
async function saveFile(filename,data,msg){const type=/\.ttf$/i.test(filename)?'font/ttf':'image/png';
 if(DL){try{await DL.save({filename,data});msg(`‘${filename}’ 저장했어요.`)}catch(e){msg(e&&e.code==='declined'?'저장을 취소했어요.':'여기선 저장이 안 돼요.')}return}
 const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios&&navigator.canShare){try{const fl=new File([data],filename,{type});if(navigator.canShare({files:[fl]})){try{await navigator.share({files:[fl]});msg(`‘${filename}’을 보냈어요. ‘파일에 저장’을 고르면 파일 앱에 들어가요.`)}catch(e){msg(e&&e.name==='AbortError'?'저장을 취소했어요.':'공유 창을 열 수 없어요.')}return}}catch(e){}}
 try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);msg(`‘${filename}’ 내려받기를 시작했어요.`)}catch(e){msg('여기선 저장이 안 돼요.')}}
let busy=false;
async function buildTTF(f,onProg){const P=GE.norm(f.p),codes=GE.ALL(),glyphs=[{cs:[[[50,0],[50,700],[450,700],[450,0]],[[100,50],[400,50],[400,650],[100,650]]],adv:500}],map=[];
 for(let i=0;i<codes.length;i++){const g=GE.glyph(String.fromCodePoint(codes[i]),f.p);if(g){map.push([codes[i],glyphs.length]);glyphs.push({cs:g.cs,adv:g.adv})}if(i%400===0){onProg(i/codes.length);await new Promise(r=>setTimeout(r,0))}}
 onProg(1);await new Promise(r=>setTimeout(r,0));return TTF.make(f.name,glyphs,map,{weight:Math.round(Math.min(900,Math.max(100,(P.w-20)*8))/100)*100})}
$('edTTF').onclick=async()=>{if(busy)return;busy=true;const f=ST.cur,bar=$('edBar'),msg=t=>$('edMsg').textContent=t;bar.classList.remove('hide');$('edTTF').disabled=true;msg('글자 11,000여 개를 만드는 중…');
 try{const data=await buildTTF(f,v=>{bar.firstChild.style.width=Math.round(v*100)+'%';msg(`글자 만드는 중… ${Math.round(v*100)}%`)});const fn=(f.name||'글꼴정원').replace(/[\\/:*?"<>|]/g,'')+'.ttf';
  msg(`다 만들었어요 (${(data.length/1048576).toFixed(1)}MB). 저장 창을 여는 중…`);await saveFile(fn,data,msg)}catch(e){msg('만들다가 문제가 생겼어요: '+e.message)}
 busy=false;$('edTTF').disabled=false;setTimeout(()=>bar.classList.add('hide'),1500)};

// ---- 미리보기 ----
const BGS={paper:['#fffdf8','#1d1d1b'],sky:['#e8f2ff','#17325c'],pink:['#ffeef3','#5a2236'],night:['#1f2430','#f4f1ea']};
function pvList(){const L=[...ST.keep];if(ST.cur&&!L.some(f=>f.id===ST.cur.id))L.unshift(ST.cur);ST.gen.forEach(f=>{if(!L.some(x=>x.id===f.id))L.push(f)});return L}
function fillPvFonts(){const L=pvList(),s=$('pvFont'),v=s.value||ST.pvId;s.innerHTML=L.map(f=>`<option value="${f.id}">${isKept(f.id)?'♥ ':''}${esc(f.name)}</option>`).join('');if(L.some(f=>f.id===v))s.value=v;else if(ST.cur&&L.some(f=>f.id===ST.cur.id))s.value=ST.cur.id}
function drawPv(){const f=findF($('pvFont').value)||pvList()[0];const st=$('pvStage');if(!f){st.innerHTML='<div class="empty">먼저 글씨를 뽑아 주세요.</div>';return}const [bg,fg]=BGS[ST.pvBg];st.style.background=bg;
 const W=(st.clientWidth||340)-40,sz=+ST.pvSize;st.innerHTML=($('pvTitle').value?svgText(f,$('pvTitle').value,{size:sz*1.6,maxPx:W,color:fg})+'<div style="height:12px"></div>':'')+svgText(f,$('pvTxt').value,{size:sz,maxPx:W,color:fg,lh:1.5})}
$('pvFont').onchange=()=>{ST.pvId=$('pvFont').value;save();drawPv()};['pvTxt','pvTitle'].forEach(k=>$(k).addEventListener('input',()=>{clearTimeout(slT);slT=setTimeout(drawPv,150)}));
$('pvSize').value=ST.pvSize;$('pvSizeO').textContent=ST.pvSize;$('pvSize').addEventListener('input',()=>{ST.pvSize=+$('pvSize').value;$('pvSizeO').textContent=ST.pvSize;save();cancelAnimationFrame(slT);slT=requestAnimationFrame(drawPv)});
document.querySelectorAll('[data-bg]').forEach(b=>{b.classList.toggle('on',b.dataset.bg===ST.pvBg);b.onclick=()=>{ST.pvBg=b.dataset.bg;document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('on',x===b));save();drawPv()}});
$('pvPng').onclick=async()=>{const f=findF($('pvFont').value)||pvList()[0];if(!f)return;const [bg,fg]=BGS[ST.pvBg],S=2,W=1080,pad=80,sz=+ST.pvSize*2.4;const parts=[];
 const add=(text,size,lh,y0)=>{const sc=size/1000,L=layout(f.p,text,(W-2*pad)/sc);L.forEach((ln,i)=>ln.forEach(o=>{if(o.g&&o.g.d)parts.push({d:o.g.d,x:pad+o.x*sc,y:y0+(1000*lh*i+880)*sc,sc})}));return y0+(1000*lh*(L.length-1)+1150)*sc};
 let y=pad;if($('pvTitle').value)y=add($('pvTitle').value,sz*1.6,1.38,y)+sz*.5;y=add($('pvTxt').value,sz,1.5,y)+pad;
 const cv=document.createElement('canvas');cv.width=W;cv.height=Math.ceil(y);const c=cv.getContext('2d');c.fillStyle=bg;c.fillRect(0,0,cv.width,cv.height);c.fillStyle=fg;
 parts.forEach(p=>{c.save();c.translate(p.x,p.y);c.scale(p.sc,p.sc);c.fill(new Path2D(p.d),'nonzero');c.restore()});
 cv.toBlob(async b=>{const data=new Uint8Array(await b.arrayBuffer());await saveFile((f.name||'미리보기')+'.png',data,t=>$('pvMsg').textContent=t)},'image/png')};

// ---- 화면 전환 ----
function go(v){document.querySelectorAll('.view').forEach(s=>s.classList.toggle('show',s.id==='v-'+v));document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));ST.view=v;save();
 if(v==='ed')renderEd();if(v==='pv'){fillPvFonts();drawPv()}if(v==='keep')renderKeep();window.scrollTo(0,0)}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function renderAll(){renderGen();renderKeep();renderMix();if(ST.view==='ed')syncEd()}
renderMoods();
if(!ST.gen.length){ST.gen=MK.flatMap(m=>[rnd(m),rnd(m)]);ST.genInfo='분위기별로 2개씩 뽑아 봤어요. 위에서 분위기를 고르고 🎲를 눌러 더 뽑아요.'}
renderAll();go(ST.view||'gen');
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(ST.view==='ed')drawEd();if(ST.view==='pv')drawPv()},200)});
window.__ST=()=>ST;
})();
</script>
